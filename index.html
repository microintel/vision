<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- three.js + vanta dots -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
<style>
/* ────────────────────────────────────────────
   THEME TOKENS
──────────────────────────────────────────── */
:root {
  --violet:    #7C3AED;
  --violet-l:  #A78BFA;
  --gold:      #F59E0B;
  --gold-l:    #FCD34D;
  --green:     #10B981;
  --green-l:   #6EE7B7;
  --red:       #EF4444;
  --radius:    16px;
  --radius-sm: 10px;
  --transition: 0.35s cubic-bezier(.4,0,.2,1);
}

/* DARK */
[data-theme="dark"] {
  --bg:      #08091280;
  --vanta-bg:#080912;
  --surface: #12141F;
  --card:    rgba(18,20,31,0.82);
  --border:  #252840;
  --text:    #F1F5F9;
  --muted:   #94A3B8;
  --dim:     #475569;
  --input-bg:#0e101a;
  --logo-from:#ffffff;
  --shadow:  rgba(0,0,0,0.55);
  --skeleton: linear-gradient(100deg, rgba(255,255,255,0.03) 20%, rgba(255,255,255,0.07) 40%, rgba(255,255,255,0.03) 60%);
  --card-solid: #14161F;
  --nm-dark:  rgba(0,0,0,0.5);
  --nm-light: rgba(255,255,255,0.035);
}

/* LIGHT */
[data-theme="light"] {
  --bg:      rgba(240,242,255,0.7);
  --vanta-bg:#e8eaf8;
  --surface: #f0f2ff;
  --card:    rgba(255,255,255,0.88);
  --border:  #dde0f5;
  --text:    #1E1B4B;
  --muted:   #6B7280;
  --dim:     #9CA3AF;
  --input-bg:#f5f6ff;
  --logo-from:#1E1B4B;
  --shadow:  rgba(30,27,75,0.18);
  --skeleton: linear-gradient(100deg, rgba(30,27,75,0.03) 20%, rgba(30,27,75,0.08) 40%, rgba(30,27,75,0.03) 60%);
  --card-solid: #eef0fb;
  --nm-dark:  rgba(30,27,75,0.16);
  --nm-light: rgba(255,255,255,0.9);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

#vanta-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  transition: background var(--transition);
}

body {
  font-family: 'Inter', sans-serif;
  background: transparent;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: color var(--transition);
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 20;
  padding: 20px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 6px;
  background: linear-gradient(135deg, var(--logo-from) 30%, var(--violet-l));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: background var(--transition);
}
.header-right { display: flex; align-items: center; gap: 10px; }
.badge {
  font-size: 10px; font-weight: 500; letter-spacing: 2px;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 20px;
  text-transform: uppercase;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.theme-toggle {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: transform 0.3s, border-color 0.3s, background var(--transition);
  flex-shrink: 0; line-height: 1; padding: 0;
}
.theme-toggle:hover { transform: rotate(20deg) scale(1.1); border-color: var(--violet); }
.theme-toggle:focus-visible,
.calc-card:focus-visible {
  outline: 2px solid var(--violet-l);
  outline-offset: 3px;
}

/* ── HERO ── */
.hero {
  position: relative;
  z-index: 10;
  margin: 30px 20px 0;
  text-align: center;
}
.hero h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 30px;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--text) 40%, var(--violet-l));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.6;
}

/* ── MAIN ── */
main {
  position: relative;
  z-index: 10;
  padding: 30px 16px 50px;
  max-width: 1100px;
  margin: 0 auto;
}

.calc-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
@media (min-width: 560px) {
  .calc-grid { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 960px) {
  .calc-grid { grid-template-columns: 1fr 1fr 1fr; }
  .hero h1 { font-size: 36px; }
  header { padding: 24px 40px 0; }
  .hero { margin: 36px 32px 0; }
  main { padding: 36px 32px 60px; }
}

/* ── CALCULATOR CARD (flat, neumorphic soft-shadow) ── */
.calc-card {
  position: relative;
  background: var(--card-solid);
  border: none;
  border-radius: 22px;
  padding: 28px 24px 24px;
  cursor: pointer;
  isolation: isolate;
  box-shadow:
    7px 7px 16px var(--nm-dark),
    -6px -6px 14px var(--nm-light);
  transition: box-shadow 0.3s ease, transform 0.3s cubic-bezier(.2,.8,.2,1);
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
}
.calc-card:hover,
.calc-card:focus-visible {
  transform: translateY(-4px);
  box-shadow:
    10px 10px 22px var(--nm-dark),
    -8px -8px 18px var(--nm-light);
}
.calc-card:active {
  transform: translateY(0);
  box-shadow:
    inset 5px 5px 12px var(--nm-dark),
    inset -5px -5px 12px var(--nm-light);
}

.calc-icon {
  width: 50px; height: 50px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--card-solid);
  color: var(--accent, var(--violet));
  margin-bottom: 18px;
  box-shadow:
    inset 3px 3px 7px var(--nm-dark),
    inset -3px -3px 7px var(--nm-light);
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.calc-icon svg { width: 22px; height: 22px; }
.calc-card:hover .calc-icon { transform: scale(1.06); }

.calc-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px; font-weight: 700;
  letter-spacing: -0.2px;
  color: var(--text);
  margin-bottom: 4px;
}
.calc-tagline {
  font-size: 11px; font-weight: 600;
  color: var(--accent, var(--violet));
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.calc-desc {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.65;
  margin-bottom: 16px;
  flex-grow: 1;
}

.calc-cta {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 12.5px; font-weight: 600;
  color: var(--accent, var(--violet));
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.calc-cta svg {
  width: 15px; height: 15px;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.calc-card:hover .calc-cta svg { transform: translateX(5px); }

/* ── SKELETON LOADING ── */
.calc-skeleton {
  border-radius: 22px;
  border: none;
  background: var(--card-solid);
  box-shadow:
    7px 7px 16px var(--nm-dark),
    -6px -6px 14px var(--nm-light);
  padding: 28px 24px 24px;
  min-height: 250px;
}
.skel-block {
  border-radius: 8px;
  background: var(--skeleton);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
.skel-icon { width: 50px; height: 50px; border-radius: 14px; margin-bottom: 18px; }
.skel-line { height: 11px; margin-bottom: 10px; }
.skel-line.w60 { width: 60%; }
.skel-line.w40 { width: 40%; }
.skel-line.w90 { width: 90%; }
.skel-line.w75 { width: 75%; }
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .skel-block { animation: none; }
  .calc-card, .calc-icon, .calc-cta svg { transition: none; }
}

/* ── LOAD / EMPTY / ERROR STATE ── */
.load-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 20px;
  color: var(--dim);
  font-size: 13px;
}
.load-state.error { color: var(--red); }
.retry-btn {
  margin-top: 12px;
  font-size: 12px; font-weight: 600;
  color: var(--violet-l);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 18px;
  cursor: pointer;
}
.retry-btn:hover { border-color: var(--violet); }

/* ── FOOTER ── */
footer {
  position: relative; z-index: 10;
  text-align: center; padding: 0 20px 28px;
  font-size: 11px; color: var(--dim); letter-spacing: 1px;
}

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
.fade-up { animation: fadeUp 0.5s ease both; }

*, *::before, *::after {
  transition: background-color var(--transition),
              border-color var(--transition),
              color var(--transition);
}
</style>
</head>
<body>

<div id="vanta-bg"></div>

<header>
  <div class="logo">VISION</div>
  <div class="header-right">
    <div class="badge">Calculators</div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light theme">
      <span id="themeIcon">☀️</span>
    </button>
  </div>
</header>

<div class="hero">
  <h1>Plan your wealth journey</h1>
  <p>Pick a calculator to project your investments, plan a lumpsum, or work backward from a financial goal.</p>
</div>

<main>
  <div id="calcGrid" class="calc-grid" aria-live="polite" aria-busy="true"></div>
</main>

<footer>VISION &nbsp;·&nbsp; Your wealth, visualised</footer>

<script>
/* ────────────── THEME ────────────── */
const DARK_VANTA  = { backgroundColor:0x080912, color:0x7C3AED, color2:0x7C3AED };
const LIGHT_VANTA = { backgroundColor:0xe8eaf8, color:0x7C3AED, color2:0x7C3AED };

let isDark = true;
let vantaEffect = null;

function initVanta(opts){
  if(vantaEffect) vantaEffect.destroy();
  vantaEffect = VANTA.DOTS({
    el: '#vanta-bg',
    THREE: THREE,
    mouseControls: false,
    touchControls: false,
    gyroControls: false,
    minHeight: 200,
    minWidth: 200,
    scale: 1.0,
    scaleMobile: 1.0,
    backgroundColor: opts.backgroundColor,
    color: opts.color,
    color2: opts.color2,
    size: 2.5,
    spacing: 30,
    showLines: false
  });
}

function toggleTheme(){
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
  initVanta(isDark ? DARK_VANTA : LIGHT_VANTA);
}

window.addEventListener('DOMContentLoaded', () => {
  initVanta(DARK_VANTA);
  renderSkeletons();
  loadCalculators();
});

/* ────────────── ICONS ────────────── */
const ICONS = {
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>',
  coins: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  percent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>'
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

const ACCENT_VAR = { violet:'var(--violet)', gold:'var(--gold)', green:'var(--green)' };

/* ────────────── SKELETON WHILE FETCHING ────────────── */
function renderSkeletons(count = 3){
  const grid = document.getElementById('calcGrid');
  grid.innerHTML = Array.from({ length: count }).map(() => `
    <div class="calc-skeleton">
      <div class="skel-block skel-icon"></div>
      <div class="skel-block skel-line w60" style="height:15px;"></div>
      <div class="skel-block skel-line w40"></div>
      <div class="skel-block skel-line w90" style="margin-top:14px;"></div>
      <div class="skel-block skel-line w75"></div>
    </div>
  `).join('');
}

/* ────────────── FETCH CALCULATOR DATA (JSON FILE) ────────────── */
async function loadCalculators(){
  const grid = document.getElementById('calcGrid');
  try {
    const res = await fetch('calculators.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const calcs = await res.json();
    renderCalculators(calcs);
  } catch(err){
    console.error('Failed to load calculators.json', err);
    grid.innerHTML = `
      <div class="load-state error">
        Couldn't load calculators. ${location.protocol === 'file:' ? 'Open this page over a local server (not file://) so it can fetch calculators.json.' : 'Please check your connection and try again.'}
        <br><button class="retry-btn" onclick="renderSkeletons(); loadCalculators();">Retry</button>
      </div>`;
  } finally {
    grid.setAttribute('aria-busy', 'false');
  }
}

/* ────────────── RENDER ────────────── */
function renderCalculators(calcs){
  const grid = document.getElementById('calcGrid');

  if(!Array.isArray(calcs) || !calcs.length){
    grid.innerHTML = '<div class="load-state">No calculators available yet.</div>';
    return;
  }

  grid.innerHTML = calcs.map((c, i) => `
    <a class="calc-card fade-up" href="${c.file}" style="--accent:${ACCENT_VAR[c.accent] || 'var(--violet)'}; animation-delay:${i * 0.08}s">
      <div class="calc-icon">${ICONS[c.icon] || ICONS.trend}</div>
      <div class="calc-name">${c.name}</div>
      <div class="calc-tagline">${c.tagline}</div>
      <div class="calc-desc">${c.description}</div>
      <div class="calc-cta">Open Calculator ${ARROW}</div>
    </a>
  `).join('');
}
</script>
</body>
</html>
