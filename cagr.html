<!DOCTYPE html>

<meta charset="UTF-8">
<script>
/* ── Theme persistence (IndexedDB) — keeps theme in sync across all Vision pages ── */
(function(){
  document.documentElement.style.visibility = 'hidden';
  var DB_NAME = 'VisionAppDB', STORE = 'settings', KEY = 'theme';
  var bc = ('BroadcastChannel' in window) ? new BroadcastChannel('vision-theme') : null;
  var dbPromise = new Promise(function(resolve){
    try{
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){ e.target.result.createObjectStore(STORE); };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ resolve(null); };
    }catch(err){ resolve(null); }
  });
  function getTheme(){
    return dbPromise.then(function(db){
      return new Promise(function(resolve){
        if(!db) return resolve('dark');
        try{
          var tx = db.transaction(STORE,'readonly');
          var rq = tx.objectStore(STORE).get(KEY);
          rq.onsuccess = function(){ resolve(rq.result || 'dark'); };
          rq.onerror = function(){ resolve('dark'); };
        }catch(err){ resolve('dark'); }
      });
    });
  }
  function setTheme(theme){
    return dbPromise.then(function(db){
      if(!db) return;
      try{
        var tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(theme, KEY);
      }catch(err){}
    }).then(function(){
      if(bc) bc.postMessage(theme);
    });
  }
  function onChange(cb){
    if(bc) bc.onmessage = function(e){ cb(e.data); };
  }
  window.ThemeDB = { getTheme: getTheme, setTheme: setTheme, onChange: onChange };
  window.__themeApplied = getTheme().then(function(theme){
    document.documentElement.setAttribute('data-theme', theme);
    return theme;
  });
  setTimeout(function(){ document.documentElement.style.visibility = 'visible'; }, 400);
})();
</script>

<style>
/* ────────────────────────────────────────────
   THEME TOKENS
──────────────────────────────────────────── */
:root {
  --violet:    #7C3AED;
  --violet-l:  #A78BFA;
  --gold:      #F59E0B;
  --gold-l:    #FCD34D;
  --green:     #10B981;
  --red:       #EF4444;
  --radius:    16px;
  --radius-sm: 10px;
  --transition: 0.35s cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg:      #08091280;
  --vanta-bg:#080912;
  --surface: #12141F;
  --card:    rgba(18,20,31,0.82);
  --border:  #252840;
  --text:    #F1F5F9;
  --muted:   #94A3B8;
  --dim:     #475569;
  --input-bg:#0e101a;
  --logo-from:#ffffff;
  --card-solid: #14161F;
  --nm-dark:  rgba(0,0,0,0.5);
  --nm-light: rgba(255,255,255,0.035);
}

[data-theme="light"] {
  --bg:      rgba(240,242,255,0.7);
  --vanta-bg:#e8eaf8;
  --surface: #f0f2ff;
  --card:    rgba(255,255,255,0.88);
  --border:  #dde0f5;
  --text:    #1E1B4B;
  --muted:   #6B7280;
  --dim:     #9CA3AF;
  --input-bg:#f5f6ff;
  --logo-from:#1E1B4B;
  --card-solid: #eef0fb;
  --nm-dark:  rgba(30,27,75,0.16);
  --nm-light: rgba(255,255,255,0.9);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

#vanta-bg { position: fixed; inset: 0; z-index: 0; transition: background var(--transition); }

body {
  font-family: 'Inter', sans-serif;
  background: transparent;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: color var(--transition);
}

header {
  position: relative; z-index: 20;
  padding: 20px 24px 0;
  display: flex; justify-content: space-between; align-items: center;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 22px; letter-spacing: 6px;
  background: linear-gradient(135deg, var(--logo-from) 30%, var(--violet-l));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  transition: background var(--transition);
}

.header-right { display: flex; align-items: center; gap: 10px; }

.badge {
  font-size: 10px; font-weight: 500; letter-spacing: 2px;
  color: var(--muted); background: var(--card); border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 20px; text-transform: uppercase;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.theme-toggle {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: transform 0.3s, border-color 0.3s, background var(--transition);
  flex-shrink: 0; line-height: 1; padding: 0;
}
.theme-toggle:hover { transform: rotate(20deg) scale(1.1); border-color: var(--violet); }

.hero-quote {
  position: relative; z-index: 10;
  margin: 22px 20px 0;
  background: var(--card-solid); border: none; border-radius: var(--radius);
  padding: 16px 18px; display: flex; align-items: center; gap: 14px; overflow: hidden;
  box-shadow: 6px 6px 14px var(--nm-dark), -5px -5px 12px var(--nm-light);
  transition: box-shadow 0.3s ease;
}
.hero-quote::before {

  background: var(--violet); border-radius: 3px 0 0 3px;
}
.quote-avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--violet); object-fit: cover; flex-shrink: 0; }
.quote-author { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; color: var(--gold); margin-bottom: 3px; }
.quote-body { font-size: 11px; color: var(--muted); line-height: 1.6; font-style: italic; }

/* ── TAB DROPDOWN ── */
.tab-select-wrap {
  position: relative; z-index: 10;
  padding: 16px 20px 6px;
}
.tab-select {
  -webkit-appearance: none; -moz-appearance: none; appearance: none;
  width: 100%;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13.5px; font-weight: 600; letter-spacing: 0.3px;
  color: var(--text); background: var(--card-solid);
  border: 1px solid var(--border);
  padding: 13px 42px 13px 16px; border-radius: var(--radius-sm); cursor: pointer;
  box-shadow: 5px 5px 12px var(--nm-dark), -4px -4px 10px var(--nm-light);
  transition: all 0.25s ease;
  background-image: linear-gradient(135deg, var(--violet-l) 50%, transparent 50%),
                     linear-gradient(45deg, transparent 50%, var(--violet-l) 50%);
  background-position: calc(100% - 22px) center, calc(100% - 17px) center;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
.tab-select:hover { border-color: var(--violet); }
.tab-select:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,58,237,0.2); }
.tab-select option {
  background: var(--card-solid); color: var(--text);
  font-family: 'Inter', sans-serif; font-weight: 500; padding: 10px;
}

@media (min-width: 900px) {
  .tab-select-wrap { padding: 16px 32px 6px; }
  .tab-select { max-width: 420px; }
}

main {
  position: relative; z-index: 10;
  padding: 16px 16px 40px;
  max-width: 1200px; margin: 0 auto;
}

.group-label {

.input-row { margin-bottom: 26px; }

.slider-wrap { display: flex; align-items: center; gap: 10px; }

/* ── WEALTH METER ARC ── */
.wealth-meter { display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px 0 12px; }
.arc-container { position: relative; width: 200px; height: 110px; }
.arc-container svg { width: 200px; height: 110px; overflow: visible; }
.arc-bg     { stroke: var(--border); fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke var(--transition); }
.arc-invest { fill: none; stroke-width: 12; stroke-linecap: round; stroke: var(--violet);

.arc-earn   { fill: none; stroke-width: 12; stroke-linecap: round; stroke: var(--gold);

.arc-total  { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--text); line-height: 1; }

/* ── DURATION HERO ── */
.duration-hero { text-align: center; padding: 26px 0 8px; }
.duration-value { font-family: 'Space Grotesk', sans-serif; font-size: 46px; font-weight: 700; color: var(--violet-l); line-height: 1; }
.duration-unit { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }

/* ── COMPARE STATS ── */
.compare-stats { display: flex; gap: 12px; padding: 8px 0 18px; }
.stat-block {
  flex: 1; text-align: center; background: var(--card-solid); border-radius: var(--radius-sm);

}

.stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; }

.pill-label { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
.pill-value { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; line-height: 1.2; }
.pill-value .unit { font-size: 10px; font-weight: 500; color: var(--dim); }

.pill-earn   .pill-value { color: var(--gold); }
.pill-total  .pill-value { color: var(--green); }

/* ── TABLE ── */
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); }
.section-sub   { font-size: 11px; color: var(--dim); }
.table-wrap    { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 400px; border-collapse: collapse; }
thead th { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
tbody tr { transition: background 0.15s; }
tbody tr:hover { background: rgba(124,58,237,0.06); }
tbody td { padding: 10px; font-size: 12px; border-bottom: 1px solid var(--border); color: var(--text); }
tbody tr:last-child td { border-bottom: none; }
.td-year   { font-size: 11px; color: var(--dim); white-space: nowrap; }
.td-invest { color: var(--violet-l); font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
.td-earn   { color: var(--gold); font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
.td-total  { color: var(--green); font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
.grow-bar-wrap { display: flex; align-items: center; gap: 6px; }
.grow-bar { height: 4px; background: var(--border); border-radius: 4px; flex: 1; overflow: hidden; }
.grow-bar-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width 0.6s ease; }

/* ── FORMULA ── */
.formula-box {
  font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; text-align: center;
  color: var(--text); background: var(--card-solid); border: none; border-radius: var(--radius-sm);
  padding: 18px 12px; letter-spacing: 0.5px;
  box-shadow: inset 3px 3px 8px var(--nm-dark), inset -3px -3px 8px var(--nm-light);
}
.formula-box sup { color: var(--gold); font-size: 13px; }
.formula-legend { margin-top: 14px; display: grid; gap: 8px; }
.formula-legend div { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.formula-legend span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--violet-l); min-width: 14px; }

.insight-text { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* ── EXAMPLE CARD ── */
.example-num { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; }
.example-desc { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
.example-box {
  background: rgba(124,58,237,0.07); border-left: 3px solid var(--violet);

.example-box .result { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--green); }
.example-box .result.neg { color: var(--red); }

.line-chart-wrap { margin-top: 18px; position: relative; height: 220px; }

::-webkit-scrollbar { width: 5px; height: 5px; }

::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

*, *::before, *::after { transition: background-color var(--transition), border-color var(--transition), color var(--transition); }
input[type="range"], input[type="range"]::-webkit-slider-thumb { transition: none; }
</style>

<script>
/* ────────────── THEME / VANTA ────────────── */
const DARK_VANTA  = { backgroundColor:0x080912, color:0x7C3AED, color2:0x7C3AED };
const LIGHT_VANTA = { backgroundColor:0xe8eaf8, color:0x7C3AED, color2:0x7C3AED };
let isDark = true;
let vantaEffect = null;

function initVanta(opts){
  if(vantaEffect) vantaEffect.destroy();
  vantaEffect = VANTA.DOTS({
    el: '#vanta-bg', THREE: THREE,
    mouseControls: true, touchControls: true, gyroControls: false,
    minHeight: 200, minWidth: 200, scale: 1.0, scaleMobile: 1.0,
    backgroundColor: opts.backgroundColor, color: opts.color, color2: opts.color2,
    size: 2.5, spacing: 30, showLines: false
  });
}

function applyTheme(theme){
  isDark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  var icon = document.getElementById('themeIcon');
  if(icon) icon.textContent = isDark ? '☀️' : '🌙';
  initVanta(isDark ? DARK_VANTA : LIGHT_VANTA);
  document.documentElement.style.visibility = 'visible';
  compute();
}

function toggleTheme(){
  var next = isDark ? 'light' : 'dark';
  applyTheme(next);
  ThemeDB.setTheme(next);
}

ThemeDB.onChange(function(theme){
  if((theme === 'dark') !== isDark) applyTheme(theme);
});

/* ────────────── FORMAT HELPERS ────────────── */
function fmtSmart(n){
  if(!isFinite(n)) return '0';
  if(Math.abs(n) < 1000 && !Number.isInteger(n)) return n.toLocaleString('en-IN',{maximumFractionDigits:2});
  return n.toLocaleString('en-IN',{maximumFractionDigits:0});
}
function fmtShort(n){
  if(!isFinite(n)) return '0';
  const a = Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(1)+'T';
  if(a>=1e7)  return (n/1e7).toFixed(1)+'Cr';
  if(a>=1e5)  return (n/1e5).toFixed(1)+'L';
  if(a>=1e3)  return (n/1e3).toFixed(1)+'K';
  return Number.isInteger(n) ? n.toFixed(0) : n.toFixed(2);
}

/* ────────────── CORE MATH ────────────── */
function computeCAGR(pv,fv,n){ if(pv<=0 || n<=0) return 0; return (Math.pow(fv/pv, 1/n) - 1) * 100; }
function computeFV(pv,r,n){ return pv * Math.pow(1+r/100, n); }
function computePV(fv,r,n){ return fv / Math.pow(1+r/100, n); }
function computeDuration(pv,fv,r){
  if(pv<=0 || fv<=0) return NaN;
  const base = 1+r/100; if(base<=0) return NaN;
  const ratio = fv/pv; if(ratio<=0) return NaN;
  return Math.log(ratio) / Math.log(base);
}
function calcCompound(amt,rate,years){ const fv = amt*Math.pow(1+rate/100, years); return { fv, inv:amt, gain: fv-amt }; }

/* ────────────── TAB CONFIG ────────────── */
const F = (label,min,max,step,def,unit) => ({label,min,max,step,def,unit});

const TABS = [
  { id:'basic', label:'Basic CAGR', mode:'cagr', fields:{
      pv:F('Initial Value',0,10000000,1000,100000),
      fv:F('Final Value',0,10000000,1000,250000),

let allState = {};
TABS.forEach(t => { allState[t.id] = {}; Object.keys(t.fields).forEach(k => allState[t.id][k] = t.fields[k].def); });
let currentTab = TABS[0].id;

/* ────────────── INPUT RENDERING ────────────── */
function dispValue(cfg, v){
  if(cfg.unit === '%') return v + '%';
  if(cfg.unit === 'yrs') return v + ' yrs';
  return '₹' + fmtSmart(v);
}

function fieldRowHTML(key, cfg){
  const v = allState[currentTab][key];
  return `
  <div class="input-row">
    <div class="input-label">
      <span>${cfg.label}</span>
      <span id="disp-${key}">${dispValue(cfg, v)}</span>
    </div>
    <div class="slider-wrap">
      <input type="range" id="sl-${key}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${v}" oninput="syncField('${key}',this.value)">
      <input type="number" id="in-${key}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${v}" oninput="syncField('${key}',this.value)">
    </div>
  </div>`;
}

function renderInputs(tab){
  let html = `<div class="card"><div class="card-title">Configure — ${tab.label}</div>`;
  if(tab.groups){
    tab.groups.forEach(g => {
      html += `<div class="group-label">${g.title}</div>`;
      g.keys.forEach(k => html += fieldRowHTML(k, tab.fields[k]));
    });
  } else {
    Object.keys(tab.fields).forEach(k => html += fieldRowHTML(k, tab.fields[k]));
  }
  html += `</div>`;
  document.getElementById('inputsCard').innerHTML = html;
}

function syncField(key, val){
  const tab = TABS.find(t => t.id === currentTab);
  const cfg = tab.fields[key];
  let v = parseFloat(val); if(isNaN(v)) v = 0;
  v = Math.min(Math.max(v, cfg.min), cfg.max);
  allState[currentTab][key] = v;
  const sl = document.getElementById('sl-'+key), inp = document.getElementById('in-'+key);
  if(sl) sl.value = v;
  if(inp) inp.value = v;
  const disp = document.getElementById('disp-'+key);
  if(disp) disp.textContent = dispValue(cfg, v);
  compute();
}

/* ────────────── TABS ────────────── */
function switchTab(id){
  currentTab = id;
  const sel = document.getElementById('tabSelect');
  if(sel) sel.value = id;
  const tab = TABS.find(t => t.id === id);
  document.getElementById('calcBadge').textContent = tab.label;
  renderInputs(tab);
  compute();
}

function arcBlock(label){
  return `<div class="wealth-meter">

        <path class="arc-bg" d="M 10 100 A 90 90 0 0 1 190 100"/>

        <div class="arc-total" id="arcCenterVal">—</div>
        <div class="arc-label">${label}</div>
      </div>
    </div>
  </div>`;
}

function setArc(invPct, altColor){
  const iLen = ARC_LEN*invPct, eLen = ARC_LEN*(1-invPct);
  const a = document.getElementById('arcA'), b = document.getElementById('arcB');
  if(!a || !b) return;
  a.style.strokeDasharray = `${iLen} ${eLen+2}`;
  a.style.strokeDashoffset = '0';
  b.style.strokeDasharray = `${eLen} ${iLen+2}`;
  b.style.strokeDashoffset = `-${iLen}`;
  b.style.stroke = altColor ? 'var(--red)' : 'var(--gold)';
}

function pillsBlock(items){
  return `<div class="result-pills">` + items.map(it =>
    `<div class="pill pill-${it.cls}"><div class="pill-label">${it.label}</div><div class="pill-value"${it.color ? ` style="color:${it.color}"` : ''}>${it.value}</div></div>`
  ).join('') + `</div>`;
}

function formulaCard(formulaHTML, legend){

    <div class="formula-legend">

}

function insightCard(text){

}

/* ────────────── GROWTH TABLE + CHARTS ────────────── */
function buildGrowthRows(pv,r,n){
  const y = new Date().getFullYear();
  const maxFv = calcCompound(pv,r,n).fv;
  let rows = '';
  for(let yr=1; yr<=n; yr++){
    const {fv,inv,gain} = calcCompound(pv,r,yr);
    const pct = maxFv>0 ? Math.min(100,(fv/maxFv)*100) : 0;
    rows += `<tr>
      <td class="td-year">${y+yr} <span style="font-size:10px">[${yr}y]</span></td>
      <td class="td-invest">₹${fmtShort(inv)}</td>
      <td class="td-earn">₹${fmtShort(gain)}</td>
      <td class="td-total">
        <div class="grow-bar-wrap">
          <span>₹${fmtShort(fv)}</span>
          <div class="grow-bar"><div class="grow-bar-fill" style="width:${pct}%"></div></div>
        </div>
      </td>
    </tr>`;
  }
  return rows;
}

let dynChartInstance = null;
function renderChart(canvasId, labels, seriesDefs){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  if(dynChartInstance){ dynChartInstance.destroy(); dynChartInstance = null; }
  const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDarkMode ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
  const tickColor = isDarkMode ? '#94A3B8' : '#6B7280';

  dynChartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: seriesDefs.map(s => ({
      label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.fillA,
      fill: true, tension: 0.35,
      pointRadius: labels.length<=15?3:1, pointHoverRadius: 5, borderWidth: 2,
      order: s.order, borderDash: s.dash ? [4,3] : []
    })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { display:true, position:'top', labels:{ color:tickColor, boxWidth:10, boxHeight:10, padding:14, font:{size:11,family:'Inter'} } },
        tooltip: {
          backgroundColor: isDarkMode ? '#12141F' : '#fff',
          borderColor: isDarkMode ? '#252840' : '#dde0f5', borderWidth:1,
          titleColor: isDarkMode ? '#F1F5F9' : '#1E1B4B',
          bodyColor: isDarkMode ? '#94A3B8' : '#6B7280', padding:10,
          callbacks: { label: c => ` ₹${fmtShort(c.raw)}` }
        }
      },
      scales: {
        x: { ticks:{ color:tickColor, maxRotation:45, font:{size:10}, maxTicksLimit: Math.min(labels.length,15) }, grid:{color:gridColor} },
        y: { ticks:{ color:tickColor, font:{size:10}, callback: v => '₹'+fmtShort(v) }, grid:{color:gridColor} }
      }
    }
  });
}

function drawGrowthChart(pv,r,n){
  const y = new Date().getFullYear();
  const labels=[], invD=[], gainD=[], totD=[];
  for(let yr=1; yr<=n; yr++){
    const {fv,inv,gain} = calcCompound(pv,r,yr);
    labels.push(y+yr); invD.push(Math.round(inv)); gainD.push(Math.round(gain)); totD.push(Math.round(fv));
  }
  renderChart('dynChart', labels, [
    {label:'Total Value', data:totD, color:'#10B981', fillA:'rgba(16,185,129,0.10)', order:1, dash:false},
    {label:'Growth', data:gainD, color:'#F59E0B', fillA:'rgba(245,158,11,0.08)', order:2, dash:false},
    {label:'Invested', data:invD, color:'#A78BFA', fillA:'rgba(124,58,237,0.08)', order:3, dash:true}
  ]);
}

function drawComparisonChart(pvA,fvA,nA,pvB,fvB,nB){
  const cagrA = (pvA>0 && nA>0) ? computeCAGR(pvA,fvA,nA)/100 : 0;
  const cagrB = (pvB>0 && nB>0) ? computeCAGR(pvB,fvB,nB)/100 : 0;
  const maxN = Math.max(nA,nB,1);
  const y = new Date().getFullYear();
  const labels=[], dataA=[], dataB=[];
  for(let yr=1; yr<=maxN; yr++){
    labels.push(y+yr);
    dataA.push(yr<=nA ? Math.round(pvA*Math.pow(1+cagrA,yr)) : Math.round(fvA));
    dataB.push(yr<=nB ? Math.round(pvB*Math.pow(1+cagrB,yr)) : Math.round(fvB));
  }
  renderChart('dynChart', labels, [
    {label:'Investment A', data:dataA, color:'#7C3AED', fillA:'rgba(124,58,237,0.10)', order:1, dash:false},
    {label:'Investment B', data:dataB, color:'#F59E0B', fillA:'rgba(245,158,11,0.10)', order:2, dash:false}
  ]);
}

/* ────────────── COMPUTE / RENDER PER MODE ────────────── */
function compute(){
  const tab = TABS.find(t => t.id === currentTab);
  const st = allState[currentTab];

  if(tab.mode === 'cagr'){
    const {pv,fv,n} = st;
    const cagr = (pv>0 && n>0) ? computeCAGR(pv,fv,n) : 0;
    const growing = fv >= pv;
    const growth = fv - pv;
    const invPct = growing ? (fv>0 ? pv/fv : 1) : (pv>0 ? fv/pv : 0);

    const resultsHTML = arcBlock('CAGR') + pillsBlock([
      {label:tab.fields.pv.label, value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:tab.fields.fv.label, value:'₹'+fmtSmart(fv), cls:'earn'},
      {label:'Net Change', value:(growth>=0?'+₹':'−₹')+fmtSmart(Math.abs(growth)), cls:'total', color: growth>=0?'var(--green)':'var(--red)'}
    ]);
    const rightHTML = formulaCard('CAGR = (F ÷ I)<sup>1/n</sup> − 1', [
      ['F', tab.fields.fv.label], ['I', tab.fields.pv.label], ['n', tab.fields.n.label + ' (years)']
    ]) + insightCard(growing
      ? `Grew at ${cagr.toFixed(2)}% per year on average, compounded annually over ${n} years.`
      : `Declined at ${Math.abs(cagr).toFixed(2)}% per year on average over ${n} years.`)
      + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
    setArc(Math.max(0,Math.min(1,invPct)), !growing);
    const cv = document.getElementById('arcCenterVal');
    cv.innerHTML = (cagr>=0?'':'−') + Math.abs(cagr).toFixed(2) + '%';
    cv.style.color = cagr>=0 ? 'var(--green)' : 'var(--red)';
  }

  else if(tab.mode === 'fv'){
    const {pv,r,n} = st;
    const fv = computeFV(pv,r,n);
    const gain = fv - pv;
    const invPct = fv>0 ? pv/fv : 1;

    const resultsHTML = arcBlock('Future Value') + pillsBlock([
      {label:tab.fields.pv.label, value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:'Growth', value:'₹'+fmtSmart(gain), cls:'earn'},
      {label:'Future Value', value:'₹'+fmtSmart(fv), cls:'total'}
    ]);
    const rightHTML = formulaCard('FV = PV × (1 + r/100)<sup>n</sup>', [
      ['FV','Future Value'], ['PV', tab.fields.pv.label], ['r', tab.fields.r.label], ['n', tab.fields.n.label]
    ]) + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
    setArc(Math.max(0,Math.min(1,invPct)), false);
    const cv = document.getElementById('arcCenterVal');
    cv.innerHTML = '₹'+fmtShort(fv);
    cv.style.color = 'var(--text)';
  }

  else if(tab.mode === 'pv'){
    const {fv,r,n} = st;
    const pv = computePV(fv,r,n);
    const discount = fv - pv;
    const pvPct = fv>0 ? pv/fv : 1;

    const resultsHTML = arcBlock('Present Value') + pillsBlock([
      {label:tab.fields.fv.label, value:'₹'+fmtSmart(fv), cls:'earn'},
      {label:'Present Value', value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:'Discount', value:'₹'+fmtSmart(discount), cls:'total'}
    ]);
    const rightHTML = formulaCard('PV = FV ÷ (1 + r/100)<sup>n</sup>', [
      ['PV','Present Value'], ['FV', tab.fields.fv.label], ['r', tab.fields.r.label], ['n', tab.fields.n.label]
    ]) + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
    setArc(Math.max(0,Math.min(1,pvPct)), false);
    const cv = document.getElementById('arcCenterVal');
    cv.innerHTML = '₹'+fmtShort(pv);
    cv.style.color = 'var(--violet-l)';
  }

  else if(tab.mode === 'duration'){
    const {pv,fv,r} = st;
    const n = computeDuration(pv,fv,r);
    const valid = !isNaN(n) && isFinite(n) && n>=0;

    const resultsHTML = `
      <div class="duration-hero">
        <div class="duration-value">${valid ? n.toFixed(1) : '—'}</div>
        <div class="duration-unit">years</div>
      </div>` + pillsBlock([
      {label:tab.fields.pv.label, value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:tab.fields.fv.label, value:'₹'+fmtSmart(fv), cls:'earn'},
      {label:tab.fields.r.label, value:r+'%', cls:'total'}
    ]);
    const rightHTML = formulaCard('n = log(F ÷ I) ÷ log(1 + r/100)', [
      ['n','Time required (years)'], ['F', tab.fields.fv.label], ['I', tab.fields.pv.label], ['r', tab.fields.r.label]
    ]) + exampleCard(tab.id);
    setPanels(resultsHTML, rightHTML);
  }

  else if(tab.mode === 'growth'){
    const {pv,r,n} = st;
    const fv = computeFV(pv,r,n);
    const gain = fv - pv;
    const invPct = fv>0 ? pv/fv : 1;

    const resultsHTML = arcBlock('Total Value') + pillsBlock([
      {label:'Invested', value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:'Growth', value:'₹'+fmtSmart(gain), cls:'earn'},
      {label:'Total', value:'₹'+fmtSmart(fv), cls:'total'}
    ]);
    const rightHTML = `<div class="card">
        <div class="section-header"><div class="section-title">Growth Milestones</div><div class="section-sub">@ ${r}% p.a.</div></div>
        <div class="table-wrap"><table><thead><tr><th>Timeline</th><th>Invested</th><th>Growth</th><th>Value</th></tr></thead><tbody id="growthBody"></tbody></table></div>
        <div class="line-chart-wrap"><canvas id="dynChart"></canvas></div>
      </div>` + formulaCard('A = P × (1 + r/100)<sup>n</sup>', [
        ['A','Future value'], ['P', tab.fields.pv.label], ['r', tab.fields.r.label], ['n', tab.fields.n.label]
      ]) + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
    setArc(Math.max(0,Math.min(1,invPct)), false);
    const cv = document.getElementById('arcCenterVal');
    cv.innerHTML = '₹'+fmtShort(fv);
    cv.style.color = 'var(--text)';
    document.getElementById('growthBody').innerHTML = buildGrowthRows(pv,r,n);
    drawGrowthChart(pv,r,n);
  }

  else if(tab.mode === 'cagrvsabs'){
    const {pv,fv,n} = st;
    const cagr = (pv>0 && n>0) ? computeCAGR(pv,fv,n) : 0;
    const absReturn = pv>0 ? ((fv-pv)/pv*100) : 0;

    const resultsHTML = `
      <div class="compare-stats">
        <div class="stat-block"><div class="stat-label">CAGR (Annualized)</div><div class="stat-value" style="color:${cagr>=0?'var(--green)':'var(--red)'}">${cagr.toFixed(2)}%</div></div>
        <div class="stat-block"><div class="stat-label">Absolute Return</div><div class="stat-value" style="color:${absReturn>=0?'var(--gold)':'var(--red)'}">${absReturn.toFixed(2)}%</div></div>
      </div>` + pillsBlock([
      {label:tab.fields.pv.label, value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:tab.fields.fv.label, value:'₹'+fmtSmart(fv), cls:'earn'},
      {label:tab.fields.n.label, value:n+' yrs', cls:'total'}
    ]);
    const rightHTML = formulaCard('CAGR ≠ Absolute Return', [
      ['CAGR','Annualized compounding rate'], ['Absolute','Total change, ignoring time']
    ]) + insightCard(`An absolute return of ${absReturn.toFixed(1)}% over ${n} years works out to a CAGR of ${cagr.toFixed(2)}% per year once compounding is accounted for.`)
      + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
  }

  else if(tab.mode === 'inflation'){
    const {pv,fv,n,infl} = st;
    const nominal = (pv>0 && n>0) ? computeCAGR(pv,fv,n) : 0;
    const real = ((1+nominal/100)/(1+infl/100) - 1) * 100;

    const resultsHTML = `
      <div class="compare-stats">
        <div class="stat-block"><div class="stat-label">Nominal CAGR</div><div class="stat-value" style="color:var(--violet-l)">${nominal.toFixed(2)}%</div></div>
        <div class="stat-block"><div class="stat-label">Inflation</div><div class="stat-value" style="color:var(--gold)">${infl}%</div></div>
        <div class="stat-block"><div class="stat-label">Real CAGR</div><div class="stat-value" style="color:${real>=0?'var(--green)':'var(--red)'}">${real.toFixed(2)}%</div></div>
      </div>` + pillsBlock([
      {label:tab.fields.pv.label, value:'₹'+fmtSmart(pv), cls:'invest'},
      {label:tab.fields.fv.label, value:'₹'+fmtSmart(fv), cls:'earn'},
      {label:tab.fields.n.label, value:n+' yrs', cls:'total'}
    ]);
    const rightHTML = formulaCard('Real = (1+Nominal)/(1+Inflation) − 1', [
      ['Nominal','Uninflated CAGR'], ['Inflation', tab.fields.infl.label], ['Real','Purchasing-power-adjusted CAGR']
    ]) + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
  }

  else if(tab.mode === 'comparison'){
    const {pvA,fvA,nA,pvB,fvB,nB} = st;
    const cagrA = (pvA>0 && nA>0) ? computeCAGR(pvA,fvA,nA) : 0;
    const cagrB = (pvB>0 && nB>0) ? computeCAGR(pvB,fvB,nB) : 0;
    const winner = cagrA===cagrB ? 'tie' : (cagrA>cagrB ? 'A' : 'B');

    const resultsHTML = `
      <div class="compare-stats">
        <div class="stat-block ${winner==='A'?'winner':''}"><div class="stat-label">Investment A</div><div class="stat-value" style="color:${cagrA>=0?'var(--green)':'var(--red)'}">${cagrA.toFixed(2)}%</div></div>
        <div class="stat-block ${winner==='B'?'winner':''}"><div class="stat-label">Investment B</div><div class="stat-value" style="color:${cagrB>=0?'var(--green)':'var(--red)'}">${cagrB.toFixed(2)}%</div></div>
      </div>
      <p class="compare-note">${winner==='tie' ? 'Both investments grew at the same rate.' : `Investment ${winner} compounded faster.`}</p>` + pillsBlock([
      {label:'A: Initial → Final', value:'₹'+fmtShort(pvA)+' → ₹'+fmtShort(fvA), cls:'invest'},
      {label:'B: Initial → Final', value:'₹'+fmtShort(pvB)+' → ₹'+fmtShort(fvB), cls:'earn'},
      {label:'Years (A / B)', value:nA+' / '+nB, cls:'total'}
    ]);
    const rightHTML = `<div class="card">
        <div class="section-header"><div class="section-title">Growth Comparison</div><div class="section-sub">A vs B over time</div></div>
        <div class="line-chart-wrap"><canvas id="dynChart"></canvas></div>
      </div>` + formulaCard('CAGR = (F ÷ I)<sup>1/n</sup> − 1', [['A','Investment A'],['B','Investment B']]) + exampleCard(tab.id);

    setPanels(resultsHTML, rightHTML);
    drawComparisonChart(pvA,fvA,nA,pvB,fvB,nB);
  }
}

/* ────────────── INIT ────────────── */
window.addEventListener('DOMContentLoaded', () => {
  window.__themeApplied.then(applyTheme);
  document.getElementById('tabSelect').innerHTML = TABS.map(t =>
    `<option value="${t.id}">${t.label}</option>`
  ).join('');
  switchTab(TABS[0].id);
});
</script>
</body>
</html>
